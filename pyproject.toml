[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "qel"
version = "0.1.0"
description = "Quant Edge Lab: contracts, conformance oracle, accounting and research services"
requires-python = ">=3.12"
dependencies = [
  "jsonschema==4.25.1",
  "numpy",
  "scipy",
  "pyarrow",
  "duckdb",
  "cryptography==50.0.2",
]

[project.scripts]
qel = "qel.cli:main"

[tool.setuptools]
package-dir = {"" = "python"}

[tool.setuptools.packages.find]
where = ["python"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["python"]
