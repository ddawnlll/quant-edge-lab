[package]
name = "qel-data-engine-ingest"
version = "0.1.0"
edition = "2021"
publish = false
description = "Rust-native Binance archive ZIP -> typed Parquet ingestion (schema v2, scale 1e8)"

[dependencies]
anyhow = "1.0"
arrow = { version = "58", default-features = false, features = ["prettyprint"] }
csv = "1.3"
parquet = { version = "58", default-features = false, features = ["arrow", "zstd"] }
qel-data-engine-core = { path = "../core" }
serde_json = "1.0"
sha2 = "0.10"
zip = "2.6"

[lib]
name = "qel_data_engine_ingest"
path = "src/lib.rs"

[[bin]]
name = "qel-ingest"
path = "src/main.rs"
